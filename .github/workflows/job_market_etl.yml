name: Daily Job Market ETL

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

concurrency:
  group: job-market-etl
  cancel-in-progress: false

jobs:
  collect-and-report:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the latest main branch
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run offline checks
        run: python -m unittest discover -s tests -v

      - name: Run the ETL pipeline
        run: python main.py

      - name: Preserve raw snapshots for inspection
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: raw-snapshots-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/raw/*.json
          retention-days: 14
          if-no-files-found: warn

      - name: Commit updated database and reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/job_market.sqlite3 reports/technology_mentions.csv reports/technology_mentions.png reports/collection_coverage.csv

          if git diff --cached --quiet; then
            echo "No changes to save."
            exit 0
          fi

          git commit -m "Update job snapshot and technology reports"
          git pull --rebase origin main
          git push origin HEAD:main
